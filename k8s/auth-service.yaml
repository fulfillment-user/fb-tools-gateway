apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fb-tools-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: europe-west1-docker.pkg.dev/tourathy-project/prod-images/auth-service:manual-test
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: SESSION_SECRET
            - name: GATEWAY_CONFIG
              value: /config/config.yaml
            - name: GATEWAY_LOG_DB
              value: /data/access_log.sqlite3
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: gateway-log
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: gateway-config
        - name: gateway-log
          persistentVolumeClaim:
            claimName: gateway-log-data
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: fb-tools-gateway
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
