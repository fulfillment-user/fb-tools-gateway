apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: fb-tools-gateway
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 1Gi
---
