# Production shape: every image is pre-built and pushed by
# scripts/build_and_deploy.py, tagged ${REGISTRY}/<slug>:latest -- one
# consistent naming convention, no per-app env var to remember to add. New
# apps just need a new service block here (copy the quotation-tool one) plus
# an apps/<slug>/source.yaml -- see docs/RUNBOOK.md.
#
# For local testing on a laptop instead (builds from source on disk rather
# than pulling), use docker-compose.local.yml. See docs/RUNBOOK.md.
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth-service

  auth-service:
    image: ${REGISTRY:?set REGISTRY, see docs/DEVOPS_HANDOFF.md}/auth-service:latest
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set a real random secret, not committed to git}
      GATEWAY_CONFIG: /config/config.yaml
      GATEWAY_LOG_DB: /data/access_log.sqlite3
    volumes:
      - ./config/config.yaml:/config/config.yaml:ro
      - gateway_log_data:/data

  quotation-tool:
    image: ${REGISTRY:?set REGISTRY, see docs/DEVOPS_HANDOFF.md}/quotation-tool:latest
    restart: unless-stopped
    expose:
      - "8505"

volumes:
  caddy_data:
  caddy_config:
  gateway_log_data:
