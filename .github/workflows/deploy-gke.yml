name: Build and Deploy FB Tools Gateway to GKE

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGISTRY_HOST: europe-west1-docker.pkg.dev
  REGISTRY_REPO: prod-images
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: fb-tools-gateway

jobs:
  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud for Artifact Registry
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_ARTIFACT_KEY }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Allow Docker to push images to Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY_HOST }} --quiet

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      # Allow build_and_deploy.py to clone the private
      # fulfillment-user/fb-rate-engine repository
      - name: Configure access to fb-rate-engine
        env:
          GH_TOKEN: ${{ secrets.FB_RATE_ENGINE_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      # Detect apps, clone external repositories,
      # build Docker images and push them to Artifact Registry
      - name: Build and Push all apps
        env:
          REGISTRY: ${{ env.REGISTRY_HOST }}/${{ env.PROJECT_ID }}/${{ env.REGISTRY_REPO }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          python3 scripts/build_and_deploy.py

      # Detect which applications must be deployed
      - name: List deployable app slugs
        id: apps
        run: |
          SLUGS=$(find apps -mindepth 2 -maxdepth 2 -name source.yaml \
            -printf '%h\n' | xargs -n1 basename | sort | paste -sd, -)

          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "Apps: $SLUGS"

    outputs:
      slugs: ${{ steps.apps.outputs.slugs }}

  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud for GKE
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_K8S_KEY }}'

      # Connect kubectl to the GKE cluster
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      # Sync config.yaml used by auth-service
      - name: Sync gateway-config
        run: |
          kubectl create configmap gateway-config \
            --from-file=config.yaml=config/config.yaml \
            --namespace "${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Sync Caddy configuration
      - name: Sync gateway-caddyfile
        run: |
          kubectl create configmap gateway-caddyfile \
            --from-file=Caddyfile=Caddyfile \
            --namespace "${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Update auth-service
      - name: Update auth-service image
        run: |
          kubectl set image deployment/auth-service \
            auth-service=${REGISTRY_HOST}/${PROJECT_ID}/${REGISTRY_REPO}/auth-service:${IMAGE_TAG} \
            -n "${NAMESPACE}"

      # Update Leads CRM, Quotation Tool, etc.
      - name: Update application images
        run: |
          IFS=',' read -ra SLUGS <<< "${{ needs.build.outputs.slugs }}"

          for slug in "${SLUGS[@]}"; do
            echo "Deploying $slug"

            kubectl set image deployment/"$slug" \
              "$slug"=${REGISTRY_HOST}/${PROJECT_ID}/${REGISTRY_REPO}/"$slug":${IMAGE_TAG} \
              -n "${NAMESPACE}"
          done

      # Wait until deployments are ready
      - name: Check Rollout Status
        run: |
          kubectl rollout status deployment/auth-service \
            -n "${NAMESPACE}" \
            --timeout=5m

          IFS=',' read -ra SLUGS <<< "${{ needs.build.outputs.slugs }}"

          for slug in "${SLUGS[@]}"; do
            kubectl rollout status deployment/"$slug" \
              -n "${NAMESPACE}" \
              --timeout=5m
          done

      # Final verification
      - name: Verify Deployment
        run: |
          kubectl get deployments -n "${NAMESPACE}"
          kubectl get pods -n "${NAMESPACE}"