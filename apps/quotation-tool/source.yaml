# Where this tool's actual code lives -- NOT copied into this repo. The
# build script (scripts/build_and_deploy.py) clones this at build time.
# Adding a brand new tool to the family = a new folder here with a
# source.yaml like this one, pointing wherever that tool's code lives (a
# brand new repo is fine) -- no new pipeline needed, the one pipeline that
# already watches this repo picks it up automatically.
repo: https://github.com/fulfillment-user/fb-rate-engine.git
ref: main
dockerfile: Dockerfile.quotation-tool
context: "."
